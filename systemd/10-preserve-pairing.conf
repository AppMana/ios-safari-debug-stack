# usbmuxd preflight treats every StartSession SSL failure as an invalid
# pairing record and deletes it, including failures during USB disconnects.
# Let clients open sessions using persistent /var/lib/lockdown records.
# First-time pairing is explicit: idevicepair -u <UDID> pair.
[Service]
ExecStart=
ExecStart=/usr/sbin/usbmuxd --user usbmux --systemd --no-preflight
